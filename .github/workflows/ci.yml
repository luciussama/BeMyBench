name: CI

on:
  push:
    branches: [main, 'fix/**', 'iter/**']
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  rust:
    name: Rust (core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test (release)
        run: cargo test --release

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Rust core (release)
        working-directory: rust
        run: cargo build --release

      # Constrói o app sem assinar: o objetivo é validar que o código
      # nativo (Swift/Metal) e o projeto Xcode compilam.
      - name: Flutter build macOS (debug, sem assinatura)
        run: flutter build macos --debug

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Valida a compilação do código nativo Kotlin (canais de bateria,
      # sensores e GPU/OpenGL ES). O core Rust é empacotado apenas no
      # workflow de release (cargo-ndk), então não entra aqui.
      - name: Flutter build APK (debug)
        run: flutter build apk --debug

