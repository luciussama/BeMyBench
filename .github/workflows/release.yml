name: Build & Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag da Versão (ex: v1.0)'
        required: true
        default: 'v1.0'

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 1. CREATE RELEASE: Cria imediatamente a Release no GitHub
  # ===========================================================================
  create-release:
    name: Criar Release no GitHub
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag_step.outputs.RELEASE_TAG }}
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Determinar Tag da Release
        id: tag_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Criar Release Pública Inicial
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag_step.outputs.RELEASE_TAG }}
          name: "BMyBench ${{ steps.tag_step.outputs.RELEASE_TAG }} — Release Multi-Plataforma"
          draft: false
          prerelease: false
          generate_release_notes: true

  # ===========================================================================
  # 2. ANDROID: Compilação do Rust Core (NDK) e Upload do APK na Release
  # ===========================================================================
  build-android:
    name: Build Android APK
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Adicionar Targets Rust para Android
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk

      - name: Configurar Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: "Compilar Core Rust para Android"
        run: |
          mkdir -p android/app/src/main/jniLibs
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release
          cd ..

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Obter dependências do Flutter
        run: flutter pub get

      - name: Compilar APK de Release
        run: flutter build apk --release

      - name: Preparar Artefato Android
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/bemybench-android.apk

      - name: Upload Direto do APK na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: artifacts/bemybench-android.apk

  # ===========================================================================
  # 3. MACOS: Compilação do Rust Core, Empacotamento DMG e Upload na Release
  # ===========================================================================
  build-macos:
    name: Build macOS DMG
    needs: [create-release]
    runs-on: macos-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Core Rust (macOS)
        run: |
          cd rust
          cargo build --release
          cd ..

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Obter dependências do Flutter
        run: flutter pub get

      - name: Compilar Aplicativo macOS
        run: flutter build macos --release

      - name: Embutir dylib Rust no Bundle e Criar DMG
        run: |
          APP="build/macos/Build/Products/Release/bemybench.app"
          mkdir -p "$APP/Contents/Frameworks"
          cp rust/target/release/libbemybench_core.dylib "$APP/Contents/Frameworks/"
          codesign --force --sign - "$APP/Contents/Frameworks/libbemybench_core.dylib"
          codesign --force --sign - "$APP"
          
          mkdir -p artifacts
          hdiutil create -volname "BMyBench" -srcfolder "$APP" -ov -format UDZO artifacts/bemybench-macos.dmg

      - name: Upload Direto do DMG na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: artifacts/bemybench-macos.dmg

  # ===========================================================================
  # 4. WINDOWS: Compilação do Rust Core, ZIP e Upload na Release
  # ===========================================================================
  build-windows:
    name: Build Windows x64
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Core Rust (Windows x64)
        run: |
          cd rust
          cargo build --release
          cd ..

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Habilitar Desktop Windows e Obter Dependências
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Compilar Executável Windows
        run: flutter build windows --release

      - name: Copiar DLL Rust e Compactar Release
        shell: pwsh
        run: |
          $ReleaseDir = if (Test-Path "build/windows/x64/runner/Release") { "build/windows/x64/runner/Release" } else { "build/windows/runner/Release" }
          Copy-Item "rust/target/release/bemybench_core.dll" -Destination "$ReleaseDir/"
          New-Item -ItemType Directory -Force -Path "artifacts"
          Compress-Archive -Path "$ReleaseDir/*" -DestinationPath "artifacts/bemybench-windows-x64.zip" -Force

      - name: Upload Direto do ZIP na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: artifacts/bemybench-windows-x64.zip

  # ===========================================================================
  # 5. LINUX: Compilação do Rust Core, Pacote e Upload na Release
  # ===========================================================================
  build-linux:
    name: Build Linux x64
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de build Linux (GTK3, CMake, Ninja, Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Core Rust (Linux)
        run: |
          cd rust
          cargo build --release
          cd ..

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Habilitar Desktop Linux e Obter Dependências
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Compilar Bundle Linux
        run: flutter build linux --release

      - name: Embutir lib Rust e Compactar Pacote Linux
        run: |
          BUNDLE=$(find build/linux -name bundle -type d | head -n 1)
          mkdir -p "$BUNDLE/lib"
          cp rust/target/release/libbemybench_core.so "$BUNDLE/lib/"
          
          mkdir -p artifacts
          tar -czvf artifacts/bemybench-linux-x64.tar.gz -C "$BUNDLE" .

      - name: Upload Direto do Pacote Linux na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.create-release.outputs.release_tag }}
          files: artifacts/bemybench-linux-x64.tar.gz
